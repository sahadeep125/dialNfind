# Serves a built single-page app (provider portal or admin console). Every path that is not a file falls
# back to index.html, so deep links such as /subscription or /providers/12 load the app instead of a 404.
server {
  listen 8080;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build files never change, so browsers may keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Product analytics (PostHog) sent through this site, so ad blockers do not drop it. The provider portal
  # is built with VITE_POSTHOG_HOST=/ingest; the admin console sends no analytics.
  location /ingest/static/ {
    proxy_pass https://us-assets.i.posthog.com/static/;
    proxy_set_header Host us-assets.i.posthog.com;
    proxy_ssl_server_name on;
  }
  location /ingest/array/ {
    proxy_pass https://us-assets.i.posthog.com/array/;
    proxy_set_header Host us-assets.i.posthog.com;
    proxy_ssl_server_name on;
  }
  location /ingest/ {
    proxy_pass https://us.i.posthog.com/;
    proxy_set_header Host us.i.posthog.com;
    proxy_ssl_server_name on;
    client_max_body_size 20m;
  }

  # index.html must always be fresh, or people keep loading an old build after a deploy.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }
}
