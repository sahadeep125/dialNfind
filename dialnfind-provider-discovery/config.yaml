# Category rules. There is one rule per dialnfind subcategory, plus one category-level rule per
# category that catches businesses whose evidence doesn't name a specific service.
# Rule names are listed in categories.txt, and `dialnfind:` maps each rule onto the slugs in
# ../server/prisma/data/categories.json. The CLI refuses to run if any mapping is unknown.
#
# Evidence per rule:
#   keywords       phrases looked for in the name (weak) and in page text, JSON-LD and OSM descriptions
#   queries        Brave / Google search queries; the city is appended
#   osm_tags       OSM tags that on their own mean the service is offered (strong)
#   osm_weak_tags  shop types that only suggest it and need a name match (osm_name_regex or keywords)
#   osm_name_regex name pattern (POSIX ERE and Python compatible) that corroborates weak tags
#   overture / overture_weak   Overture taxonomy ids (taxonomy.primary or hierarchy), strong / weak
#   fsq / fsq_weak             Foursquare category names (last label segment), strong / weak
# A strong tag belongs to exactly one rule; the build warns otherwise. Tags shared by a
# category's services (craft=electronics_repair) are strong on the category-level rule and weak
# on the specific ones, so a name like "... Mobile Repairing" picks the specific service.
category_rules:
  # --- Electronics Repair ----------------------------------------------------------------------
  Electronics Repair:
    dialnfind: {category: electronics-repair}
    keywords: [electronics repair, electronic repair, electronics service, electronic service centre,
               electronics service center, electronic works]
    queries: [electronics repair, electronic repair shop]
    osm_tags: [craft=electronics_repair, shop=electronics_repair]
    overture: [electronics_repair_shop]
    overture_weak: [electronics_store, electronic_parts_supplier]
    fsq: [electronics repair shop]
    osm_name_regex: "electronic.*(repair|service|care|works)"
  TV Repair:
    dialnfind: {category: electronics-repair, subcategory: tv-repair}
    keywords: [tv repair, television repair, led tv repair, lcd tv repair, smart tv repair, tv service,
               tv servicing, tv repairing, tv mechanic, led repair]
    queries: [TV repair, LED TV repair, smart TV repair]
    osm_weak_tags: [craft=electronics_repair, shop=electronics_repair, shop=electronics, shop=television]
    overture_weak: [electronics_repair_shop, electronics_store]
    osm_name_regex: "\\btv\\b|television|led repair"
  Mobile Phone Repair:
    dialnfind: {category: electronics-repair, subcategory: mobile-phone-repair}
    keywords: [mobile repair, mobile repairing, mobile phone repair, phone repair, smartphone repair,
               cell phone repair, mobile service, mobile service centre, mobile service center,
               mobile screen replacement, iphone repair, mobile care]
    queries: [mobile repair, mobile phone repair shop]
    osm_weak_tags: [craft=electronics_repair, shop=mobile_phone, shop=electronics_repair]
    overture: [mobile_phone_repair]
    overture_weak: [mobile_phone_store, electronics_repair_shop, mobile_phone_accessory_store]
    fsq: [mobile phone repair shop]
    fsq_weak: [mobile phone store]
    osm_name_regex: "mobile.*(repair|service|care|clinic|point|solution)|phone repair|cell ?care|i ?care"
  Laptop & Computer Repair:
    dialnfind: {category: electronics-repair, subcategory: laptop-and-computer-repair}
    keywords: [laptop repair, computer repair, pc repair, desktop repair, computer service, laptop service,
               computer servicing, laptop servicing, computer hardware repair, motherboard repair,
               laptop screen replacement, data recovery, printer repair]
    queries: [laptop repair, computer repair, laptop service center]
    osm_tags: [craft=computer_repair]
    osm_weak_tags: [shop=computer, craft=electronics_repair]
    overture: [it_service_and_computer_repair]
    overture_weak: [computer_store, computer_hardware_company, electronics_repair_shop]
    fsq: [computer repair service]
    fsq_weak: [computer store]
    osm_name_regex: "laptop|computer.*(repair|service|care|solution|clinic)|\\bpc\\b.*(repair|care)|infotech|computers?$"
  Home Theatre & Audio Repair:
    dialnfind: {category: electronics-repair, subcategory: home-theatre-and-audio-repair}
    keywords: [home theatre repair, home theater repair, speaker repair, amplifier repair, audio repair,
               music system repair, sound system repair, car stereo installation]
    queries: [home theatre repair, speaker repair]
    osm_weak_tags: [craft=electronics_repair, shop=hifi]
    overture: [car_stereo_installation]
    overture_weak: [electronics_repair_shop, car_stereo_store]
    osm_name_regex: "sound|audio|speaker|amplifier|home theat"
  CCTV Installation:
    dialnfind: {category: electronics-repair, subcategory: cctv-installation}
    keywords: [cctv installation, cctv camera installation, cctv service, cctv repair, cctv camera, cctv dealer,
               security camera installation, surveillance system, access control, biometric attendance,
               video door phone, fire alarm system]
