# dialnfind provider discovery configuration.
# Precedence: built-in defaults < this file < environment (.env) < CLI flags.

city: Siliguri
state: West Bengal
country: India

# Put a real address here (or CONTACT_EMAIL in .env). It is sent in the User-Agent
# so website owners can contact you about the crawler.
contact_email: ""

output_dir: output
state_db: output/discovery.db
max_results: 20000             # cap on discovered candidates across all sources

# Category slugs of the dialnfind server; every category rule below must map onto them.
dialnfind_categories: ../server/prisma/data/categories.json

crawler:
  request_delay: 2            # seconds between requests to the same domain (minimum 1)
  max_pages_per_domain: 5
  timeout: 15
  max_retries: 2              # retries for temporary errors (429/5xx/network); never infinite
  max_concurrent_domains: 3   # domains crawled in parallel; one request at a time per domain
  max_response_bytes: 3000000
  max_redirects: 5
  max_attempts_per_url: 3     # across --resume runs
  robots_cache_hours: 24
  max_crawl_delay: 120        # sites asking for a longer Crawl-delay are skipped

scoring:
  minimum_relevance: 50       # main CSV threshold (overridden by --min-score)
  minimum_quality: 40         # below this -> review CSV
  reject_below_relevance: 20  # below this -> rejected entirely

sources:
  osm: true
  overture: true              # Overture Maps places (open data, needs `duckdb`)
  foursquare: false           # Foursquare OS Places; needs FSQ_TOKEN + FSQ_RELEASE_DATE in .env
  websites: true
  manual_urls: true
  licensed_search_api: false  # Brave / Google CSE; turn on once BRAVE_SEARCH_API_KEY is in .env
  directories: false

# Which source wins when merged records disagree (first = highest priority).
source_priority: [website, overture, fsq, osm, directory, search_api, manual]

osm:
  # One small bounding-box query per run. Endpoints are tried in order; the next one
  # is used only if the previous fails (public servers are often busy).
  endpoints:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  request_delay: 5            # seconds between Overpass requests (fair-use policy)
  timeout: 90                 # server-side query timeout, seconds
  # Search area [south, west, north, east]. Empty = one cached Nominatim lookup of the city.
  # Siliguri example: [26.64, 88.38, 26.79, 88.49]
  bbox: []
  bbox_padding_km: 2          # widen the looked-up city box (suburbs, Matigara, NJP...)
  cache_hours: 168

overture:
  release: 2026-09-23.1       # https://docs.overturemaps.org/release/latest/
  s3_region: us-west-2
  min_confidence: 0.3         # Overture's existence score; real local shops often sit at 0.3-0.5
  cache_hours: 720            # extract cached as output/overture_*.parquet

foursquare:
  release_date: ""            # dt= folder of the Hugging Face release, e.g. 2025-09-09 (or FSQ_RELEASE_DATE)
  max_age_days: 730           # skip places not refreshed for two years
  cache_hours: 720

search_api:
  provider: brave             # brave | google_cse  (keys go in .env)
  results_per_query: 10
  request_delay: 1.5
  cache_hours: 168
  max_queries_per_category: 2  # x 69 rules = about 140 queries per run

geocoding:
  enabled: false
  provider: none              # none | nominatim | opencage
  request_delay: 1.1          # Nominatim policy: max 1 request/second
  cache_hours: 720

extraction:
  include_description: true   # short meta/JSON-LD description, truncated
  description_max_chars: 300

dedup:
  name_merge_threshold: 92      # fuzzy name score needed to auto-merge (with location agreement)
  name_candidate_threshold: 85  # fuzzy name score that flags duplicate_candidate (no merge)
  address_match_threshold: 85
  shared_hosting_domains:
    - blogspot.com
    - wordpress.com
    - wixsite.com
    - weebly.com
    - github.io
    - godaddysites.com
    - webnode.page
    - jimdosite.com
    - site123.me
    - netlify.app
    - vercel.app

# Never fetched by any source. Includes sites whose terms forbid automated access,
# login-walled social networks, and map/search result pages.
# Patterns: exact domain (also blocks subdomains) or wildcard TLD like "google.*".
blocked_domains:
  - google.*
  - goo.gl
  - g.page
  - g.co
  - business.site
  - bing.com
  - yahoo.com
  - duckduckgo.com
  - justdial.com
  - jdmagicbox.com
  - indiamart.com
  - tradeindia.com
  - sulekha.com
  - urbancompany.com
  - facebook.com
  - fb.com
  - fb.me
  - instagram.com
  - linkedin.com
  - twitter.com
  - x.com
  - youtube.com
  - youtu.be
  - pinterest.com
  - whatsapp.com
  - wa.me
  - yelp.*
  - tripadvisor.*
  - zomato.com
  - swiggy.com
  - amazon.*
  - flipkart.com
  - apple.com
  - wikipedia.org

# Directories you have confirmed permit automated access (check their robots.txt AND terms).
# Disabled by default. Each entry needs permission_confirmed: true to run.
# seed_urls may use {city} and {category} placeholders.
directories: []
#  - name: example-directory
#    permission_confirmed: true
#    seed_urls:
#      - https://directory.example.org/{city}/{category}

